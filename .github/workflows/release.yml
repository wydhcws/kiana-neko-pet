name: Release

# 推一个 v 开头的 tag 就会自动构建 macOS + Windows 安装包并发布到 Releases：
#   npm version patch && git push --follow-tags
# 也可以在 Actions 页面手动触发（只构建、不发布）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 两个架构必须分开跑：同一台机器连续构建 arm64/x64 两个 DMG 时
          # 卷名相同（/Volumes/琪亚娜猫娘 x.x.x），hdiutil 卸载不干净会导致第二个失败
          - os: macos-15
            name: macOS-arm64
            nativeArch: arm64
            cmd: npm run dist:mac -- --arm64
          - os: macos-15
            name: macOS-x64
            nativeArch: x86_64
            cmd: npm run dist:mac -- --x64
          - os: windows-latest
            name: Windows
            cmd: npm run dist:win

    runs-on: ${{ matrix.os }}
    name: 构建 ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 跟唱功能依赖的原生组件，仅 macOS 需要（Windows 上该脚本会自动跳过）
      # mediaremote-adapter 已随仓库 vendor（BSD-3-Clause），这里直接编译即可
      - name: 编译原生组件（macOS）
        if: runner.os == 'macOS'
        run: npm run build:native
        env:
          # runner 是 arm64，x64 安装包需要的框架得强制按 x86_64 编译
          NATIVE_ARCH: ${{ matrix.nativeArch }}

      - name: 生成图标
        run: npm run icon

      - name: 打包
        run: ${{ matrix.cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 没有 Apple 开发者证书，跳过签名与公证（用户首次打开需右键→打开）
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    name: 发布 Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          generate_release_notes: true
          body: |
            第一个版本，祝《崩坏3》十周年快乐！

            ## 下载

            | 系统 | 文件 |
            | --- | --- |
            | macOS (Apple Silicon) | `kiana-neko-pet-*-arm64.dmg` |
            | macOS (Intel) | `kiana-neko-pet-*-x64.dmg` |
            | Windows 安装版 | `kiana-neko-pet-setup-*.exe` |
            | Windows 免安装版 | `kiana-neko-pet-*-portable.exe` |

            > **macOS 提示「无法验证开发者」**：安装包未做 Apple 公证。
            > 右键点 App → 打开 → 再点「打开」，或执行
            > `xattr -cr "/Applications/琪亚娜猫娘.app"`。

            已内置四个 MMD 模型（薪炎 / 终焉 / 歌姬 / 咚琪小礼裙），开箱即用；
            模型由社区作者（神帝宇）制作，版权归 miHoYo。
            Windows 版无跟唱功能，其余功能一致。
